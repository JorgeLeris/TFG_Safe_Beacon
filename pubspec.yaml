name: safe_beacon
description: SafeBeacon is a personal safety app that allows users to send emergency alerts and share their location with trusted contacts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^9.1.1
  go_router: ^17.0.1
  dio: ^5.9.0
  retrofit: ^4.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  logging: ^1.3.0
  intl: ^0.20.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.2.0
  google_sign_in: 6.3.0
  cloud_firestore: ^6.1.2
  flutter_svg: ^2.2.3
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  freezed: ^3.2.3
  go_router_builder: ^4.1.3
  retrofit_generator: ^10.2.1
  json_serializable: ^6.11.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_flavorizr: ^2.4.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    # TODO(Team): Remove mocks from pubspec for production build
    - assets/mocks/mock_index.json
    - assets/mocks/

flavorizr:
  app:
    android:
      flavorDimensions: "env"
  flavors:
    dev:
      app:
        name: "SafeBeacon Dev"
      android:
        applicationId: "com.jlerisla.safebeacon.safebeacon.dev"
        icon: "assets/images/app-icon-android.png"
      ios:
        bundleId: "com.jlerisla.safebeacon.safebeacon.dev"
        icon: "assets/images/app-icon-ios.png"
    pre:
      app:
        name: "SafeBeacon Pre"
      android:
        applicationId: "com.jlerisla.safebeacon.safebeacon.pre"
        icon: "assets/images/app-icon-android.png"
      ios:
        bundleId: "com.jlerisla.safebeacon.safebeacon.pre"
        icon: "assets/images/app-icon-ios.png"
    prod:
      app:
        name: "SafeBeacon"
      android:
        applicationId: "com.jlerisla.safebeacon.safebeacon"
        icon: "assets/images/app-icon-android.png"
      ios:
        bundleId: "com.jlerisla.safebeacon.safebeacon"
        icon: "assets/images/app-icon-ios.png"
